name: Build portable apps

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: >
          pyinstaller --name PhishAnalyzer --onefile --windowed --clean
          --icon assets/icon.ico
          --collect-all tkinterdnd2
          --collect-all tkhtmlview
          --collect-all certifi
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PhishAnalyzer-windows
          path: dist/PhishAnalyzer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: Create venv with system tkinter
        run: python3 -m venv --system-site-packages .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build onedir bundle
        run: >
          .venv/bin/pyinstaller --name PhishAnalyzer --onedir --windowed --clean
          --collect-all tkinterdnd2
          --collect-all tkhtmlview
          --collect-all certifi
          main.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/PhishAnalyzer/* AppDir/usr/bin/
          cp assets/icon.png AppDir/phishanalyzer.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/PhishAnalyzer" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/PhishAnalyzer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PhishAnalyzer
          Exec=PhishAnalyzer
          Icon=phishanalyzer
          Categories=Utility;Security;System;
          EOF

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir PhishAnalyzer-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PhishAnalyzer-linux
          path: PhishAnalyzer-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            artifacts/PhishAnalyzer-windows/PhishAnalyzer.exe \
            artifacts/PhishAnalyzer-linux/PhishAnalyzer-x86_64.AppImage \
            --title "$TAG" \
            --generate-notes
